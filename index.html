<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 关键：让页面适配手机端 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手机端界面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 黄色背景 */
        body {
            background-color: #62551f;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px;
            font-family: Arial, sans-serif;
        }

        /* 圆形头像 */
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #fff;
            margin-bottom: 40px;
            /* 可以换成你的图片 */
            background-image: url('https://picsum.photos/200/200');
            background-size: cover;
            background-position: center;
            /* 这是我新添加的代码 */
        }

        /* 输入框样式 */
        input {
            width: 100%;
            max-width: 320px;
            padding: 14px 16px;
            margin-bottom: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        /* 绿色按钮 */
        .btn {
            width: 100%;
            max-width: 320px;
            padding: 16px;
            background-color: #800337;
            color: white;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            margin-top: 10px;
        }

        .btn:active {
            background-color: #3bc053;
        }
    </style>
</head>

<body>
    <!-- 圆形头像 -->
    <div class="avatar"></div>

    <!-- 输入框1 -->
    <input type="text" placeholder="请输入内容 1">

    <!-- 输入框2 -->
    <input type="text" placeholder="请输入内容 2">

    <!-- 绿色按钮 -->
    <button class="btn">确认提交</button>
</body>
</html>
